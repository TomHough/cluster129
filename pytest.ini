# Tests of connectivity.py.  Run from the repository root:
#   python -m pytest            fast tests (numpy, scipy, h5py, astropy)
#   python -m pytest -m slow    tests that run DisPerSE (set DISPERSE_BIN to the folder holding mse and skelconv)
[pytest]
testpaths = tests
pythonpath = .
addopts = -ra --strict-markers -m "not slow"
xfail_strict = true
markers =
    slow: runs the DisPerSE binaries (mse, skelconv) or reads the simulation snapshots; run with -m slow
